services:
  nextjs:
    image: vercel-app
    build:
      context: ./
      target: production
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  nextjs-dev:
    image: vercel-app-dev
    build:
      context: ./
      target: dev
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"